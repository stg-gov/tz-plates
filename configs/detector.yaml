# Stage-1 vehicle detector (spec §3). Active in Phase 2.
model:
  arch: ultralytics_yolo
  # No custom weights set (TZ_ALPR_VEHICLE_DETECTOR_WEIGHTS) => the factory loads
  # COCO-pretrained yolov8n, which already covers car / motorcycle / bus / truck.
  # It is auto-downloaded by ultralytics on first use.
  weights: yolov8n.pt
  imgsz: 640
  conf_threshold: 0.30
  iou_threshold: 0.50
  max_det: 50

# COCO ids mapped to the vehicle taxonomy used by this platform.
class_map:
  2: car
  3: motorcycle
  5: bus
  7: truck
# Classes with no COCO equivalent are learned by fine-tuning on local data
# (training/train_vehicle_detector.py). Until then a daladala reads as "bus" and a
# bajaji as "motorcycle", which does not block plate recognition (spec §32).
extra_classes:
  - minibus        # daladala
  - tuktuk         # bajaji

train:
  data_yaml: datasets/annotations/vehicles/vehicles.yaml
  epochs: 100
  batch: 16
  imgsz: 640
  patience: 20
  device: 0
  project: runs/vehicle_detector
  name: v1
