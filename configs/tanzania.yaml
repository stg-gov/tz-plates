# Tanzania plate-rule engine configuration.
# Consumed by src/tz_alpr/country_rules/tanzania.py. Everything here is data, not code:
# regex, character-position rules, plate categories, OCR corrections and confidence
# adjustments can be tuned without touching the model or the Python.

country_code: TZ
country_name: Tanzania

# Alphabet the OCR head is allowed to emit for this country (upper-case Latin + digits).
charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"

# Characters that never legitimately appear on a Tanzanian plate serial/series.
# Used as a hard prior during Tanzania-aware decoding.
forbidden_letters: []          # TZ uses the full A-Z range in the 3-letter series
forbidden_digits: []

# ---------------------------------------------------------------------------
# Plate categories. Order matters: the first pattern that matches wins, so put
# the most specific patterns first. `slots` describes the expected character
# class at each position of the NORMALIZED (spaces removed) string:
#   A = alpha, N = numeric, X = alnum
# ---------------------------------------------------------------------------
categories:
  - name: PRIVATE
    description: "Private & commercial vehicles. Yellow plate, black text."
    regex: '^T\d{3}[A-Z]{3}$'
    normalized_regex: '^T[0-9]{3}[A-Z]{3}$'
    display_format: "{0} {1}{2}{3} {4}{5}{6}"   # T 331 EBG
    slots: "ANNNAAA"
    plate_colour: yellow
    lines: 2
    priority: 100
    confidence_bonus: 0.06

  - name: MOTORCYCLE
    description: "Motorcycles & tricycles (bajaji). Often a two-line plate."
    regex: '^MC\d{3}[A-Z]{3}$'
    normalized_regex: '^MC[0-9]{3}[A-Z]{3}$'
    display_format: "{0}{1} {2}{3}{4} {5}{6}{7}"  # MC 101 AAA
    slots: "AANNNAAA"
    plate_colour: yellow
    lines: 2
    priority: 95
    confidence_bonus: 0.04

  - name: GOVERNMENT
    description: "Government of Tanzania vehicles. Plain 'SU' style / older 3-letter + 4-digit."
    regex: '^[A-Z]{2,3}\d{3,4}$'
    normalized_regex: '^[A-Z]{2,3}[0-9]{3,4}$'
    display_format: "{raw}"
    slots: null
    plate_colour: white
    lines: 1
    priority: 40
    confidence_bonus: 0.0

  - name: DIPLOMATIC
    description: "Diplomatic / consular corps."
    regex: '^\d{1,3}[A-Z]{2}\d{2,4}$'
    normalized_regex: '^[0-9]{1,3}[A-Z]{2}[0-9]{2,4}$'
    display_format: "{raw}"
    slots: null
    plate_colour: blue
    lines: 1
    priority: 30
    confidence_bonus: 0.0

  - name: UNKNOWN
    description: "Did not match any known Tanzanian layout."
    regex: '^.{4,10}$'
    normalized_regex: '^.{4,10}$'
    display_format: "{raw}"
    slots: null
    plate_colour: unknown
    lines: 1
    priority: 0
    confidence_bonus: -0.20

# ---------------------------------------------------------------------------
# OCR confusion table. Keyed by the character the OCR most likely produced;
# value is the set of characters it is frequently confused WITH. The
# Tanzania-aware decoder only applies a swap when (a) the slot's expected
# class disagrees with the emitted character and (b) the alternative is in
# this table and (c) the alternative's OCR probability is within
# `swap_margin` of the argmax.
# ---------------------------------------------------------------------------
ocr_confusions:
  "0": ["O", "D", "Q"]
  "O": ["0", "D", "Q"]
  "1": ["I", "L", "T"]
  "I": ["1", "L"]
  "2": ["Z"]
  "Z": ["2"]
  "5": ["S"]
  "S": ["5"]
  "6": ["G", "b"]
  "G": ["6", "C"]
  "8": ["B"]
  "B": ["8", "6"]
  "4": ["A"]
  "A": ["4"]
  "7": ["T", "1"]
  "T": ["7"]

swap_margin: 0.35          # allowed prob gap between argmax and the rule-preferred char
min_char_prob_for_hard_lock: 0.985  # above this, never override the OCR char

# ---------------------------------------------------------------------------
# Confidence strategy weights (see src/tz_alpr/postprocessing/confidence.py).
# ---------------------------------------------------------------------------
confidence:
  weights:
    plate_detection: 0.20
    ocr: 0.55
    plate_validation: 0.25
  # geometric-mean floor so one weak stage cannot be fully masked by strong ones
  min_stage_floor: 0.05
  # logistic temperature applied to raw OCR sequence confidence before fusing
  ocr_temperature: 1.6
  ocr_bias: 0.0
  # penalty subtracted when the normalized text required >= this many rule swaps
  swap_penalty_per_char: 0.03
  length_mismatch_penalty: 0.25

# Human-verification routing thresholds (final_confidence).
review:
  auto_accept: 0.90
  review_band_low: 0.70
  # < review_band_low => manual verification / reject
