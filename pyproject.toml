[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tz-alpr"
version = "1.2.0"
description = "Open-source Automatic License Plate Recognition platform, optimized for Tanzania."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tz-alpr contributors" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2",
  "albumentations>=1.4",
  "tensorboard>=2.16",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "wandb>=0.16",
]
detect = [
  "ultralytics>=8.1",
  "huggingface_hub>=0.23",
]
onnx = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[project.scripts]
tz-alpr-api = "tz_alpr.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
